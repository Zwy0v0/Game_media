<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Game Media Client</title>
  <style>body{font-family:system-ui;margin:20px} fieldset{margin-bottom:16px}</style>
</head>
<body>
  <h1>Game Media Client</h1>

  <fieldset>
    <legend>Auth (Cognito)</legend>
    <input id="email" placeholder="email or username">
    <input id="password" placeholder="password" type="password">
    <button onclick="login()">Login</button>
    <span id="authStatus"></span>
    <details>
      <summary>Register / Confirm</summary>
      <div>
        <input id="r_user" placeholder="username">
        <input id="r_email" placeholder="email">
        <input id="r_pass" placeholder="password" type="password">
        <button onclick="registerUser()">Register</button>
      </div>
      <div>
        <input id="c_user" placeholder="username">
        <input id="c_code" placeholder="code">
        <button onclick="confirmUser()">Confirm</button>
      </div>
    </details>
  </fieldset>

  <fieldset>
    <legend>Videos</legend>
    <input id="vg" placeholder="game name" value="LoL">
    <input id="vf" type="file" accept="video/*">
    <button onclick="uploadVideo()">Upload (S3 presigned)</button>
    <input id="vid" placeholder="videoId">
    <button onclick="transcode()">Transcode</button>
    <button onclick="listVideos()">List</button>
    <div id="videos"></div>
  </fieldset>

  <fieldset>
    <legend>Screenshots</legend>
    <input id="sg" placeholder="game name" value="LoL">
    <input id="sf" type="file" accept="image/*">
    <button onclick="uploadShot()">Upload (S3 presigned)</button>
    <input id="sid" placeholder="screenshotId">
    <button onclick="processShot()">Process</button>
    <button onclick="listShots()">List</button>
    <div id="shots"></div>
  </fieldset>

<script>
const BASE = location.origin;
let token = "";

async function login(){
  const r = await fetch(`${BASE}/api/v1/auth/login`,{
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username: email.value, password: password.value })
  });
  const d = await r.json(); token = d.idToken || d.accessToken || ""; authStatus.textContent = token? "OK" : "Failed";
}
async function registerUser(){
  const r = await fetch(`${BASE}/api/v1/auth/register`,{
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username: r_user.value, email: r_email.value, password: r_pass.value })
  });
  const d = await r.json(); alert("register: " + JSON.stringify(d));
}
async function confirmUser(){
  const r = await fetch(`${BASE}/api/v1/auth/confirm`,{
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username: c_user.value, code: c_code.value })
  });
  const d = await r.json(); alert("confirm: " + JSON.stringify(d));
}

async function uploadVideo(){
  const f = vf.files[0]; if(!f) return alert("pick a video");
  const req1 = await fetch(`${BASE}/api/v1/videos/upload-url`, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${token}` }, body: JSON.stringify({ fileName: f.name, contentType: f.type }) });
  const u1 = await req1.json();
  await fetch(u1.uploadUrl, { method:"PUT", headers:{ "Content-Type": f.type }, body: f });
  const req2 = await fetch(`${BASE}/api/v1/videos`, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${token}` }, body: JSON.stringify({ key: u1.key, mimeType: f.type, game: vg.value }) });
  const d = await req2.json(); vid.value = d.id || ""; alert("uploaded: " + JSON.stringify(d));
}
async function transcode(){
  if(!vid.value) return alert("set videoId");
  const r = await fetch(`${BASE}/api/v1/videos/${vid.value}/transcode`, { method:"POST", headers:{ Authorization:`Bearer ${token}` } });
  const d = await r.json(); alert("transcode: " + JSON.stringify(d));
}
async function listVideos(){
  const r = await fetch(`${BASE}/api/v1/videos?sort=-createdAt`, { headers:{ Authorization:`Bearer ${token}` }});
  const d = await r.json();
  videos.innerHTML = d.items.map(x=>`<div>
    <b>${x._id}</b> [${x.game}] transcoded=${x.transcoded}
    <button onclick="download('${x._id}','720p')">dl 720p</button>
    <button onclick="delVideo('${x._id}')">delete</button>
  </div>`).join("");
}
// async function download(id,res="orig"){ location.href=`${BASE}/api/v1/videos/${id}/download?res=${res}`; }
async function delVideo(id){
  await fetch(`${BASE}/api/v1/videos/${id}`, { method:"DELETE", headers:{ Authorization:`Bearer ${token}` }});
  listVideos();
}

async function uploadShot(){
  const f = sf.files[0]; if(!f) return alert("pick an image");
  const req1 = await fetch(`${BASE}/api/v1/screenshots/upload-url`, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${token}` }, body: JSON.stringify({ fileName: f.name, contentType: f.type }) });
  const u1 = await req1.json();
  await fetch(u1.uploadUrl, { method:"PUT", headers:{ "Content-Type": f.type }, body: f });
  const req2 = await fetch(`${BASE}/api/v1/screenshots`, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${token}` }, body: JSON.stringify({ key: u1.key, mimeType: f.type, game: sg.value }) });
  const d = await req2.json(); sid.value = d.id || ""; alert("uploaded: " + JSON.stringify(d));
}
async function processShot(){
  if(!sid.value) return alert("set screenshotId");
  const r = await fetch(`${BASE}/api/v1/screenshots/${sid.value}/process`, { method:"POST", headers:{ Authorization:`Bearer ${token}` }});
  const d = await r.json(); alert("process: " + JSON.stringify(d));
}
async function listShots(){
  const r = await fetch(`${BASE}/api/v1/screenshots?sort=-createdAt`, { headers:{ Authorization:`Bearer ${token}` }});
  const d = await r.json();
  shots.innerHTML = d.items.map(x=>`<div>
    <b>${x._id}</b> [${x.game}] processed=${x.processed}
    <button onclick="delShot('${x._id}')">delete</button>
  </div>`).join("");
}
async function delShot(id){
  await fetch(`${BASE}/api/v1/screenshots/${id}`, { method:"DELETE", headers:{ Authorization:`Bearer ${token}` }});
  listShots();
}
</script>
</body></html>
