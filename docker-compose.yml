version: "1"
services:
  app:
    build: .
    image: game-media-app:latest
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=${AWS_REGION}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - S3_BUCKET=${S3_BUCKET}
      - DDB_TASK_TABLE=${DDB_TASK_TABLE}
      - DDB_VIDEOS_TABLE=${DDB_VIDEOS_TABLE}
      - DDB_SCREENSHOTS_TABLE=${DDB_SCREENSHOTS_TABLE}
      - QUT_USERNAME=${QUT_USERNAME}
    volumes:
      - .:/usr/src/app

