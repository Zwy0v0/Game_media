version: "3.8"
services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.api-gateway
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=ap-southeast-2
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID}
      - S3_BUCKET=${S3_BUCKET}
      - DDB_TASK_TABLE=${DDB_TASK_TABLE}
      - VIDEO_TRANSCODE_QUEUE_URL=${VIDEO_TRANSCODE_QUEUE_URL}
      - IMAGE_PROCESS_QUEUE_URL=${IMAGE_PROCESS_QUEUE_URL}
      - DLQ_URL=${DLQ_URL}
    depends_on:
      - video-processor
      - image-processor

  video-processor:
    build:
      context: .
      dockerfile: Dockerfile.video-processor
    ports:
      - "8081:8081"
    environment:
      - AWS_REGION=ap-southeast-2
      - S3_BUCKET=${S3_BUCKET}
      - DDB_TASK_TABLE=${DDB_TASK_TABLE}
      - VIDEO_TRANSCODE_QUEUE_URL=${VIDEO_TRANSCODE_QUEUE_URL}
      - DLQ_URL=${DLQ_URL}
    deploy:
      replicas: 2

  image-processor:
    build:
      context: .
      dockerfile: Dockerfile.image-processor
    ports:
      - "8082:8082"
    environment:
      - AWS_REGION=ap-southeast-2
      - S3_BUCKET=${S3_BUCKET}
      - DDB_TASK_TABLE=${DDB_TASK_TABLE}
      - IMAGE_PROCESS_QUEUE_URL=${IMAGE_PROCESS_QUEUE_URL}
      - DLQ_URL=${DLQ_URL}
    deploy:
      replicas: 2

